<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Invited!</title>
  <style>
    :root {
      /* Palette: Rich Cream & Warm Gold Accents */
      --cream-bg: radial-gradient(circle at 50% 50%, #faf6ee 0%, #ebe0cf 50%, #d4c1a7 100%);
      --cream-envelope-pocket: #f4ebd9;
      --cream-envelope-flap: #fbf5e8;
      --parchment-white: #ffffff;
      --gold-accent: #e6c275;
      --gold-border: #d4af37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--cream-bg);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      perspective: 1000px;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.65) 0%, transparent 65%);
      pointer-events: none;
    }

    /* ---------------- ENVELOPE STAGE ---------------- */
    .wrapper {
      position: relative;
      width: min(90vw, 440px);
      aspect-ratio: 44 / 30;
      z-index: 2;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }

    .container:hover {
      transform: translateY(-4px) rotateX(4deg);
    }

    /* Interior Envelope Wall */
    .envelope-back {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #e3d3bd;
      border-radius: 6px;
      box-shadow: 0 25px 45px rgba(80, 55, 20, 0.25), 0 5px 15px rgba(0,0,0,0.1);
      z-index: 1;
    }

    /* Whitish Paper Card Inside */
    .letter {
      position: absolute;
      top: 5%;
      left: 4.5%;
      width: 91%;
      height: 90%;
      background: var(--parchment-white);
      border-radius: 4px;
      padding: clamp(12px, 4vw, 25px);
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      border: 1px solid #e8dec8;
      z-index: 2;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1) 1.2s;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Gold Color Text inside the letter card */
    .invited-text {
      font-size: clamp(1.25rem, 4.8vw, 1.65rem);
      font-weight: bold;
      letter-spacing: 0.8px;
      line-height: 1.3;
      color: #9e7527;
      transition: filter 0.4s ease;
    }

    /* Bright Gold Lightning Sweep Class */
    .invited-text.gold-lightning {
      background: linear-gradient(
        120deg,
        #87601c 0%,
        #b88c35 30%,
        #ffffff 48%,
        #fff7d4 52%,
        #b88c35 70%,
        #87601c 100%
      );
      background-size: 250% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0px 1px 1px rgba(255, 255, 255, 0.8))
              drop-shadow(0px 0px 10px rgba(212, 175, 55, 0.6));
      animation: sweepGold 2.2s linear infinite;
    }

    @keyframes sweepGold {
      0% {
        background-position: 180% center;
      }
      100% {
        background-position: -80% center;
      }
    }

    /* Smooth Cream Envelope Pocket */
    .pocket {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: var(--cream-envelope-pocket);
      border-radius: 6px;
      clip-path: polygon(0 0, 0 100%, 100% 100%, 100% 0, 50% 50%);
      z-index: 3;
      box-shadow: inset 0 3px 6px rgba(255, 255, 255, 0.8), inset 0 -3px 6px rgba(0, 0, 0, 0.1);
      filter: drop-shadow(0 -4px 6px rgba(90, 65, 30, 0.15));
      border: 1px solid var(--gold-border);
      overflow: hidden;
    }

    /* Seamless Perahera Image Styling */
    .perahera-img-bottom {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      height: 42%;
      object-fit: contain;
      pointer-events: none;
      z-index: 4;
      
      /* Blend image background directly into cream envelope color */
      mix-blend-mode: multiply;
      opacity: 0.85;

      /* Softly feather top and side edges to avoid harsh boxes */
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 75%, rgba(0,0,0,0) 100%),
                          linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 8%, rgba(0,0,0,1) 92%, rgba(0,0,0,0) 100%);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 75%, rgba(0,0,0,0) 100%),
                  linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 8%, rgba(0,0,0,1) 92%, rgba(0,0,0,0) 100%);
      mask-composite: intersect;
    }

    /* Smooth Cream Top Flap */
    .flap {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: var(--cream-envelope-flap);
      border-radius: 6px;
      clip-path: polygon(0 0, 100% 0, 50% 55%);
      transform-origin: top;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
      filter: drop-shadow(0 8px 14px rgba(70, 45, 15, 0.25));
      border-top: 1.5px solid var(--gold-border);
    }

    .flap::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, rgba(255, 225, 150, 0.9), transparent);
    }

    /* Shiny Red Terracotta Wax Seal with Glint */
    .wax-seal {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(54px, 15vw, 68px);
      height: clamp(54px, 15vw, 68px);
      background: radial-gradient(circle at 35% 35%, #ff6b66 0%, #cb2a25 40%, #8b1e1b 80%, #520d0b 100%);
      border-radius: 50%;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 
        0 8px 20px rgba(30, 5, 5, 0.45),
        inset 0 3px 6px rgba(255, 220, 220, 0.75),
        inset 0 -4px 6px rgba(0, 0, 0, 0.6);
      transition: opacity 0.4s ease;
      border: 1px solid rgba(255, 120, 115, 0.6);
      overflow: hidden;
    }

    /* Wax Seal Glint Animation */
    .wax-seal::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0) 30%,
        rgba(255, 240, 200, 0.45) 50%,
        rgba(255, 255, 255, 0) 70%
      );
      transform: rotate(25deg);
      animation: sealShine 3.5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes sealShine {
      0% { transform: translateY(-100%) rotate(25deg); }
      20%, 100% { transform: translateY(100%) rotate(25deg); }
    }

    .seal-inner-ring {
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 2px solid #781816;
      box-shadow: 
        inset 0 2px 4px rgba(255, 200, 200, 0.6),
        0 1px 3px rgba(255, 220, 220, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 35% 35%, #d9433e 0%, #a82420 70%, #69110f 100%);
    }

    .seal-heart-svg {
      width: clamp(26px, 8vw, 34px);
      height: clamp(26px, 8vw, 34px);
      filter: drop-shadow(1px 1px 1px rgba(255, 210, 210, 0.6)) 
              drop-shadow(-0.5px -0.5px 0px rgba(30, 0, 0, 0.8));
    }

    .click-hint {
      position: absolute;
      bottom: -45px;
      width: 100%;
      text-align: center;
      color: #735733;
      font-weight: bold;
      font-size: clamp(0.75rem, 2.5vw, 0.95rem);
      letter-spacing: 2px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Opening Trigger Animations */
    .container.open .wax-seal { opacity: 0; }
    .container.open .flap { transform: rotateX(180deg); z-index: 1; }
    .container.open .letter { transform: translateY(-63%); }

    /* ---------------- DENSE FLOWER RAIN SYSTEM ---------------- */
    #flower-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      background: radial-gradient(circle at 30% 30%, #fffbf0, #ebd9be, #d1a76e);
      border-radius: 150% 0 150% 0;
      opacity: 0.85;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) translateX(0px) rotate(0deg) scale(0.6);
        opacity: 0;
      }
      10% { opacity: 0.9; }
      50% { transform: translateY(50vh) translateX(30px) rotate(360deg) scale(1.1); }
      100% {
        transform: translateY(105vh) translateX(-20px) rotate(720deg) scale(0.9);
        opacity: 0.1;
      }
    }

    /* Page Fade Overlay */
    #fade-overlay {
      position: fixed;
      inset: 0;
      background: #ebe0cf;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 1.5s ease-in-out;
    }

    #fade-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
	.perahera-img-bottom {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);

  /* --- SIZE & POSITION CONTROL --- */
  bottom: 8px;            /* Vertical positioning */
  width: 99%;             /* Adjust width scale (e.g., 70% to 100%) */
  height: 55%;            /* Max height ratio inside pocket */
  object-fit: contain;
  pointer-events: none;
  z-index: 4;

  /* --- BLENDING & OPACITY --- */
  mix-blend-mode: multiply;
  opacity: 0.85;

  /* --- EDGE BLUR / FADE CONTROL --- */
  /* Top Gradient: starts fading at 70%, fully invisible at 100% */
  /* Side Gradient: fades in from 0%-10%, fades out from 90%-100% */
  -webkit-mask-image: 
    linear-gradient(to top, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%),
    linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0) 100%);
  -webkit-mask-composite: source-in;
  
  mask-image: 
    linear-gradient(to top, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%),
    linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0) 100%);
  mask-composite: intersect;
}
.perahera-img-bottom {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);

  /* --- ADJUST SIZE & POSITION HERE --- */
  bottom: 0px;            /* Move down closer to the bottom border */
  width: 95%;             /* Scale width */
  height: 55%;            /* Scale height */
  object-fit: contain;
  pointer-events: none;
  z-index: 4;

  /* --- BLENDING --- */
  mix-blend-mode: multiply;
  opacity: 0.9;

}

/* --- PETAL SPEED CONTROL --- */
.petal {
  position: absolute;
  background: radial-gradient(circle at 30% 30%, #fffbf0, #ebd9be, #d1a76e);
  border-radius: 150% 0 150% 0;
  opacity: 0.75;

  /* Change animation speed here:
    - Slower fall (gentle breeze): 6s to 8s
    - Default speed: 4s to 5s
    - Faster fall: 2s to 3s
  */
  animation: fall 6s linear forwards;
}

@keyframes fall {
  0% {
    transform: translateY(-10vh) translateX(0px) rotate(0deg) scale(0.6);
    opacity: 0;
  }
  10% { opacity: 0.8; }
  50% { transform: translateY(50vh) translateX(20px) rotate(180deg) scale(0.9); }
  100% {
    transform: translateY(105vh) translateX(-15px) rotate(360deg) scale(0.7);
    opacity: 0;
  }
}
  </style>
</head>
<body>

  <div class="wrapper" id="envelopeWrapper">
    <div class="container" id="envelopeContainer" onclick="openEnvelope()">
      <div class="envelope-back"></div>
      
      <div class="letter">
        <h1 class="invited-text" id="invitedText">You Are Cordially Invited</h1>
      </div>
      
      <div class="pocket">
        <img class="perahera-img-bottom" src="pera.png" alt="Wedding Procession Pattern" onerror="this.src='image_d1be30.jpg'">
      </div>
      
      <div class="flap"></div>
      
      <div class="wax-seal">
        <div class="seal-inner-ring">
          <svg class="seal-heart-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 50 88 C 20 68 5 48 5 30 C 5 13 18 5 32 5 C 42 5 47 10 50 16 C 53 10 58 5 68 5 C 82 5 95 13 95 30 C 95 48 80 68 50 88 Z" 
                  stroke="#470908" stroke-width="4.5" fill="#a82825"/>
            <path d="M 32 15 C 24 15 15 20 15 30 C 15 42 28 56 46 72" stroke="#470908" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M 68 15 C 76 15 85 20 85 30 C 85 42 72 56 54 72" stroke="#470908" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M 25 25 C 32 28 35 36 28 42 C 22 46 18 38 25 32" stroke="#470908" stroke-width="2" fill="none"/>
            <path d="M 75 25 C 68 28 65 36 72 42 C 78 46 82 38 75 32" stroke="#470908" stroke-width="2" fill="none"/>
            <path d="M 50 25 C 44 35 40 48 48 58 C 52 62 50 70 42 66" stroke="#470908" stroke-width="2" fill="none"/>
            <path d="M 50 25 C 56 35 60 48 52 58 C 48 62 50 70 58 66" stroke="#470908" stroke-width="2" fill="none"/>
            <path d="M 50 32 C 42 38 42 46 50 52 C 58 46 58 38 50 32 Z" stroke="#470908" stroke-width="2" fill="none"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="click-hint" id="hint">CLICK TO OPEN</div>
  </div>

  <div id="flower-container"></div>
  <div id="fade-overlay"></div>

  <script>
    const MAIN_PAGE_URL = "main.html";
    let isOpened = false;

    function openEnvelope() {
      if (isOpened) return;
      isOpened = true;

      const container = document.getElementById('envelopeContainer');
      const hint = document.getElementById('hint');
      const fadeOverlay = document.getElementById('fade-overlay');
      const invitedText = document.getElementById('invitedText');

      container.classList.add('open');
      hint.style.display = 'none';

      setTimeout(() => {
        invitedText.classList.add('gold-lightning');
      }, 3400);

      setTimeout(() => {
        startContinuousFlowerRain();
      }, 800);

      setTimeout(() => {
        fadeOverlay.classList.add('active');
      }, 5500);

      setTimeout(() => {
        window.location.href = MAIN_PAGE_URL;
      }, 7000);
    }

    function createPetal() {
      const container = document.getElementById('flower-container');
      const petal = document.createElement('div');
      petal.classList.add('petal');

      const size = Math.random() * 14 + 8;
      const left = Math.random() * 100;
      const duration = Math.random() * 4 + 3.5;
      const delay = Math.random() * 0.5;

      petal.style.width = `${size}px`;
      petal.style.height = `${size * 1.35}px`;
      petal.style.left = `${left}vw`;
      petal.style.animationDuration = `${duration}s`;
      petal.style.animationDelay = `${delay}s`;

      container.appendChild(petal);

      setTimeout(() => {
        petal.remove();
      }, (duration + delay) * 1000);
    }

    function startContinuousFlowerRain() {
      for (let i = 0; i < 45; i++) {
        setTimeout(createPetal, i * 80);
      }

      setTimeout(() => {
        for (let i = 0; i < 35; i++) {
          setTimeout(createPetal, i * 100);
        }
      }, 1200);

      const continuousRain = setInterval(() => {
        createPetal();
        createPetal();
      }, 150);

      setTimeout(() => {
        clearInterval(continuousRain);
      }, 5500);
    }
  </script>

</body>
</html>
