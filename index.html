<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Invited!</title>
  <style>
    :root {
      --bg-color: #f7f4ef;
      --gold-main: linear-gradient(135deg, #e6ca65 0%, #bf953f 50%, #aa771c 100%);
      --text-color: #3e3228;
      --accent-color: #8a631c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* ---------------- ENVELOPE STAGE ---------------- */
    .wrapper {
      position: relative;
      width: min(90vw, 440px);
      aspect-ratio: 44 / 30;
      z-index: 2;
      transition: opacity 1.5s ease;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      transform-style: preserve-3d;
    }

    .envelope-back {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #5c4004;
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(138, 99, 28, 0.25);
      z-index: 1;
    }

    .letter {
      position: absolute;
      top: 5%;
      left: 4.5%;
      width: 91%;
      height: 90%;
      background: #ffffff;
      border-radius: 6px;
      padding: clamp(12px, 4vw, 25px);
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #f0e6d2;
      z-index: 2;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1) 1.2s;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .letter h1 {
      font-size: clamp(1.1rem, 4.5vw, 1.6rem);
      color: var(--accent-color);
      margin-bottom: 8px;
      font-weight: normal;
      letter-spacing: 0.5px;
    }

    .letter p {
      font-size: clamp(0.78rem, 3vw, 0.98rem);
      color: var(--text-color);
      line-height: 1.4;
      font-style: italic;
    }

    .pocket {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--gold-main);
      border-radius: 8px;
      clip-path: polygon(0 0, 0 100%, 100% 100%, 100% 0, 50% 50%);
      z-index: 3;
    }

    .flap {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      background: #aa771c;
      border-radius: 8px;
      clip-path: polygon(0 0, 100% 0, 50% 55%);
      transform-origin: top;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    }

    .wax-seal {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(38px, 12vw, 52px);
      height: clamp(38px, 12vw, 52px);
      background: radial-gradient(circle, #b8860b 0%, #745106 100%);
      border-radius: 50%;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff2a8;
      font-size: clamp(16px, 5vw, 22px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: opacity 0.4s ease;
    }

    .click-hint {
      position: absolute;
      bottom: -45px;
      width: 100%;
      text-align: center;
      color: var(--accent-color);
      font-size: clamp(0.75rem, 2.5vw, 0.95rem);
      letter-spacing: 1.5px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .container.open .wax-seal { opacity: 0; }
    .container.open .flap { transform: rotateX(180deg); z-index: 1; }
    .container.open .letter { transform: translateY(-63%); }

    /* ---------------- FLOWER RAIN EFFECT ---------------- */
    #flower-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      background: radial-gradient(circle at 30% 30%, #ffd1dc, #f8a5c2);
      border-radius: 150% 0 150% 0;
      opacity: 0.8;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(105vh) rotate(720deg) scale(1.2);
        opacity: 0.2;
      }
    }

    /* ---------------- FADE TRANSITION OVERLAY ---------------- */
    #fade-overlay {
      position: fixed;
      inset: 0;
      background-color: var(--bg-color);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 1.5s ease-in-out;
    }

    #fade-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div class="wrapper" id="envelopeWrapper">
    <div class="container" id="envelopeContainer" onclick="openEnvelope()">
      <div class="envelope-back"></div>
      <div class="letter">
        <h1>You Are Cordially Invited</h1>
        <p>We are delighted to share this special moment with you. Please wait a moment...</p>
      </div>
      <div class="pocket"></div>
      <div class="flap"></div>
      <div class="wax-seal">✦</div>
    </div>
    <div class="click-hint" id="hint">CLICK TO OPEN</div>
  </div>

  <div id="flower-container"></div>

  <div id="fade-overlay"></div>

  <script>
    const MAIN_PAGE_URL = "main.html"; // Redirect target
    let isOpened = false;

    function openEnvelope() {
      if (isOpened) return;
      isOpened = true;

      const container = document.getElementById('envelopeContainer');
      const hint = document.getElementById('hint');
      const fadeOverlay = document.getElementById('fade-overlay');

      // 1. Open Envelope
      container.classList.add('open');
      hint.style.display = 'none';

      // 2. Start Flower Rain
      setTimeout(() => {
        startFlowerRain();
      }, 1200);

      // 3. Smoothly fade out screen
      setTimeout(() => {
        fadeOverlay.classList.add('active');
      }, 3500);

      // 4. Redirect to main.html
      setTimeout(() => {
        window.location.href = MAIN_PAGE_URL;
      }, 5000);
    }

    function startFlowerRain() {
      const container = document.getElementById('flower-container');
      const petalCount = 35;

      for (let i = 0; i < petalCount; i++) {
        setTimeout(() => {
          const petal = document.createElement('div');
          petal.classList.add('petal');

          const size = Math.random() * 12 + 10;
          const left = Math.random() * 100;
          const duration = Math.random() * 4 + 4;

          petal.style.width = `${size}px`;
          petal.style.height = `${size * 1.4}px`;
          petal.style.left = `${left}vw`;
          petal.style.animationDuration = `${duration}s`;

          container.appendChild(petal);
        }, i * 150);
      }
    }
  </script>

</body>
</html>
